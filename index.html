<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="./src/css/style.css">
    </head>

    <body>
        <div class="scoreboard">

        <div class="Home-Team">
            <h1>HOME</h1>
            <div class="Home-Team-Score">
                <h2 id="home-el">0</h2>
            </div>
            <div>
            <button id="score+1Home" onclick="add1Home()">+1</button>
            <button id="score+2Home" onclick="add2Home()">+2</button>
            <button id="score+3Home" onclick="add3Home()">+3</button>
            </div>
        </div>

        <div class="Away-Team">
            <h1>AWAY</h1>
            <div class="Away-Team-Score">
                <h2 id="away-el">0</h2>
            </div>
            <button id="score+1Away" onclick="add1Away()">+1</button>
            <button id="score+2Away" onclick="add2Away()">+2</button>
            <button id="score+3Away" onclick="add3Away()">+3</button>
            </div>
        </div>

        </div>
        <p id="leading-el">No team has scored!</p>
        <button id="reset-el" onclick="reset()">Reset</button>

        <script src="./src/js/main.js"></script>

    </body>

</html>
